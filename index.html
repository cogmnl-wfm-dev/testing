<!DOCTYPE html>
<html>
<head>
  <title>Employee Lookup Test</title>
</head>
<body>

<h2>Employee Lookup</h2>

<input id="employeeId" placeholder="Enter Employee ID">

<button onclick="searchEmployee()">
Search
</button>

<pre id="result"></pre>

<script>

async function searchEmployee() {

  const id =
    document.getElementById("employeeId").value;

  const url =
    "https://script.google.com/macros/s/AKfycbxIyoy5ZqqgZe7nkT22pvbNdWgsibQwG3trFrywEMQC4zIQ878LQJM9MQkw3qBu1iQW/exec?employeeId="
    + encodeURIComponent(id);

  const response = await fetch(url);

  const data = await response.json();

  document.getElementById("result").textContent =
    JSON.stringify(data, null, 2);

}

</script>

</body>
</html>
